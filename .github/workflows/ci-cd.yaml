name: CI/CD

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

env:
  ACR_LOGIN_SERVER: project3ruoxiacr.azurecr.io
  IMAGE_NAME: tasks-api
  AKS_RESOURCE_GROUP: rg-project3-ruoxi
  AKS_CLUSTER_NAME: project3-aks
  NAMESPACE: default
  GRAFANA_DASHBOARDS_URL: https://api.ruoxi-projects.space/metrics/grafana/d/tasks-api-observability/tasks-api-observability

jobs:

  # ============================================================
  # CI + SONARQUBE
  # ============================================================
  test-and-sonarqube:
    name: Test and SonarQube
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run tests with coverage
        run: |
          pytest -v \
            --cov=app \
            --cov-report=xml

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=tasks-api \
            -Dsonar.sources=app \
            -Dsonar.tests=tests \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.host.url=http://127.0.0.1:9000 \
            -Dsonar.token="$SONAR_TOKEN"


  # ============================================================
  # BUILD + PUSH TO ACR
  # ============================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: self-hosted
    needs: test-and-sonarqube

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with Managed Identity
        run: |
          az login --identity --allow-no-subscriptions

      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name project3ruoxiacr

      - name: Build Docker image
        run: |
          docker build \
            -f app/Dockerfile \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}" \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:dev" \
            app

      - name: Push Docker image
        run: |
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:dev"


  # ============================================================
  # DEPLOY TO AKS
  # ============================================================
  deploy:
    name: Deploy to AKS
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with Managed Identity
        run: |
          az login --identity --allow-no-subscriptions

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      - name: Verify AKS access
        run: |
          kubectl get nodes

      # ----------------------------------------------------------
      # Install envsubst
      # ----------------------------------------------------------
      - name: Install envsubst
        run: |
          command -v envsubst || sudo apt-get update && sudo apt-get install -y gettext-base

      # ----------------------------------------------------------
      # Deploy new image

      # Apply the full manifest so replica count and AZ spread stick.
      # ----------------------------------------------------------
      - name: Deploy image to AKS
        env:
          TASKS_API_IMAGE: ${{ format('{0}/{1}:{2}', env.ACR_LOGIN_SERVER, env.IMAGE_NAME, github.sha) }}
          K8S_NAMESPACE: ${{ env.NAMESPACE }}
          GRAFANA_DASHBOARDS_URL: ${{ env.GRAFANA_DASHBOARDS_URL }}
        run: |
          echo "Deploying image:"
          echo "$TASKS_API_IMAGE"

          envsubst < k8s/base/tasks-api-deployment.yaml | kubectl apply -f -

      # ----------------------------------------------------------
      # Wait for rollout
      # ----------------------------------------------------------
      - name: Wait for rollout
        run: |
          echo "Waiting for deployment rollout..."

          if kubectl -n "$NAMESPACE" rollout status \
              deployment/tasks-api \
              --timeout=5m; then

            echo "Deployment rollout successful."

          else

            echo "Deployment rollout FAILED."
            echo "Starting automatic rollback..."

            echo ""
            echo "===== Deployment ====="
            kubectl -n "$NAMESPACE" get deployment tasks-api -o wide

            echo ""
            echo "===== Pods ====="
            kubectl -n "$NAMESPACE" get pods \
              -l app=tasks-api \
              -o wide

            echo ""
            echo "===== Recent Events ====="
            kubectl -n "$NAMESPACE" get events \
              --sort-by='.lastTimestamp' | tail -30

            echo ""
            echo "===== Rollout History ====="
            kubectl -n "$NAMESPACE" rollout history deployment/tasks-api

            echo ""
            echo "===== Rolling back ====="

            kubectl -n "$NAMESPACE" rollout undo deployment/tasks-api

            echo ""
            echo "Waiting for rollback to complete..."

            if kubectl -n "$NAMESPACE" rollout status \
                deployment/tasks-api \
                --timeout=5m; then

              echo "Rollback completed successfully."

            else

              echo "CRITICAL: Rollback also failed."

              echo ""
              echo "===== Deployment after rollback ====="
              kubectl -n "$NAMESPACE" get deployment tasks-api -o wide

              echo ""
              echo "===== Pods after rollback ====="
              kubectl -n "$NAMESPACE" get pods \
                -l app=tasks-api \
                -o wide

              echo ""
              echo "===== Deployment description ====="
              kubectl -n "$NAMESPACE" describe deployment tasks-api

              exit 1
            fi

            # Important:
            # Even though the old version was successfully restored,
            # the new deployment failed, so GitHub Actions must be red.
            exit 1
          fi

      # ----------------------------------------------------------
      # Verify successful deployment
      # ----------------------------------------------------------
      - name: Verify deployment
        run: |
          echo "===== Pods ====="
          kubectl -n "$NAMESPACE" get pods \
            -l app=tasks-api \
            -o wide

          echo ""
          echo "===== Deployment ====="
          kubectl -n "$NAMESPACE" get deployment tasks-api -o wide

          echo ""
          echo "===== Current image ====="
          kubectl -n "$NAMESPACE" get deployment tasks-api \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""
          echo "===== Rollout history ====="
          kubectl -n "$NAMESPACE" rollout history deployment/tasks-api