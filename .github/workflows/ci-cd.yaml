name: CI/CD

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

env:
  ACR_LOGIN_SERVER: project3ruoxiacr.azurecr.io
  IMAGE_NAME: tasks-api
  AKS_RESOURCE_GROUP: rg-project3-ruoxi
  AKS_CLUSTER_NAME: project3-aks
  NAMESPACE: default

jobs:
  test-and-sonarqube:
    name: Test and SonarQube
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run tests with coverage
        run: |
          pytest -v \
            --cov=app \
            --cov-report=xml

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=tasks-api \
            -Dsonar.sources=app \
            -Dsonar.tests=tests \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.host.url=http://127.0.0.1:9000 \
            -Dsonar.token="$SONAR_TOKEN"


  build-and-push:
    name: Build and Push Docker Image
    runs-on: self-hosted
    needs: test-and-sonarqube

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with Managed Identity
        run: |
          az login --identity --allow-no-subscriptions

      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name project3ruoxiacr

      - name: Build Docker image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}" \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:dev" \
            .

      - name: Push Docker image
        run: |
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:dev"


  deploy:
    name: Deploy to AKS
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with Managed Identity
        run: |
          az login --identity --allow-no-subscriptions

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      - name: Verify AKS access
        run: |
          kubectl get nodes

      - name: Deploy image to AKS
        run: |
          kubectl -n "$NAMESPACE" set image deployment/tasks-api \
            tasks-api="$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}"

      - name: Wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status \
            deployment/tasks-api \
            --timeout=5m

      - name: Verify deployment
        run: |
          kubectl -n "$NAMESPACE" get pods -l app=tasks-api
          kubectl -n "$NAMESPACE" get deployment tasks-api