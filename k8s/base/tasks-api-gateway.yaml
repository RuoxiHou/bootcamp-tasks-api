apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: tasks-api-gateway
  namespace: default

spec:
  gatewayClassName: approuting-istio

  listeners:
    - name: http
      protocol: HTTP
      port: 80

      allowedRoutes:
        namespaces:
          from: Same

    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: tasks-api-tls

      allowedRoutes:
        namespaces:
          from: Same