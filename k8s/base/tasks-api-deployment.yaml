apiVersion: apps/v1
kind: Deployment

metadata:
  name: tasks-api
  namespace: ${K8S_NAMESPACE}
  labels:
    app: tasks-api

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: tasks-api

  template:
    metadata:
      labels:
        app: tasks-api
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: tasks-api

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: tasks-api

      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule

      containers:
        - name: tasks-api

          image: ${TASKS_API_IMAGE}
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          env:
            # MySQL configuration
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: tasks-api-config-secret
                  key: MYSQL_HOST

            - name: MYSQL_PORT
              value: "3306"

            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: tasks-api-config-secret
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: tasks-api-config-secret
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD

            # Redis configuration
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: tasks-api-config-secret
                  key: REDIS_HOST

            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: tasks-api-config-secret
                  key: REDIS_PORT

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"


          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: tasks-api-secrets