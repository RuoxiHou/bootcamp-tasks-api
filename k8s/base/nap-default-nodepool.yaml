apiVersion: karpenter.sh/v1
kind: NodePool

metadata:
  name: default

spec:
  limits:
    cpu: "16"
    memory: "64Gi"

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    budgets:
      - nodes: "1"

  template:
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: default

      expireAfter: Never

      requirements:
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.azure.com/mode
          operator: In
          values:
            - user
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        - key: karpenter.azure.com/sku-family
          operator: In
          values:
            - D
            - F