apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: tasks-api-route
  namespace: default

spec:
  hostnames:
    - api.ruoxi-projects.space
    
  parentRefs:
    - name: tasks-api-gateway

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /tasks

      backendRefs:
        - name: tasks-api
          port: 8000