apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: tasks-api-http-redirect
  namespace: default

spec:
  hostnames:
    - ${TASKS_API_HOSTNAME}

  parentRefs:
    - name: tasks-api-gateway
      sectionName: http

  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: tasks-api-route
  namespace: default

spec:
  hostnames:
    - ${TASKS_API_HOSTNAME}

  parentRefs:
    - name: tasks-api-gateway
      sectionName: https

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /metrics/grafana
      backendRefs:
        - name: monitoring-grafana
          namespace: monitoring
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /tasks

      backendRefs:
        - name: tasks-api
          port: 8000

    - matches:
        - path:
            type: PathPrefix
            value: /metrics
      backendRefs:
        - name: tasks-api
          port: 8000

    - matches:
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: tasks-api
          port: 8000

---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant

metadata:
  name: allow-tasks-api-route-to-grafana
  namespace: monitoring

spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
  to:
    - group: ""
      kind: Service
      name: monitoring-grafana